name: Mixpost Background Scheduler & Queue Worker

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions Free Cron)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Mixpost Scheduler & Queue
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Error: APP_URL secret is not configured in GitHub repository."
            exit 1
          fi
          echo "Pinging Mixpost serverless cron endpoint..."
          curl -s -S -X GET "${APP_URL}/api/cron?token=${CRON_SECRET}" -H "Accept: application/json"
